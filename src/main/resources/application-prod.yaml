spring:
  application:
    name: rabbitmq-high-throughput-app

  # RabbitMQ Production Configuration
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq-cluster.paychex.com}
    port: 5671  # AMQP over TLS
    username: ${RABBITMQ_SERVICE_ACCOUNT_USER}
    password: ${RABBITMQ_SERVICE_ACCOUNT_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/inappcommunication}

    # TLS/SSL Configuration
    ssl:
      enabled: true
      algorithm: TLSv1.3
      validate-server-certificate: true
      trust-store: ${TRUST_STORE_PATH}
      trust-store-password: ${TRUST_STORE_PASSWORD}
      trust-store-type: JKS

    # Connection pooling - Production configuration
    # One connection per pod, multiple channels
    # Channel size should be >= max-concurrency + buffer for publishers
    cache:
      connection:
        mode: connection
        size: 1  # One connection per application instance/pod
      channel:
        size: 25  # max-concurrency (15) + buffer for publishers/admin (10)
        checkout-timeout: 10000

    # Performance optimizations
    connection-timeout: 30000
    requested-heartbeat: 30

    # Publisher confirms for reliability
    publisher-confirm-type: correlated
    publisher-returns: true

    # Listener configuration
    listener:
      simple:
        # Consumer concurrency (threads for single priority queue)
        # Uses configurable values from app.messaging.async.executor
        # IMPORTANT: These values must align with DB pool size across all pods
        concurrency: ${app.messaging.async.executor.core-threads:15}
        max-concurrency: ${app.messaging.async.executor.max-threads:15}

        # Prefetch count (messages fetched per consumer)
        # Higher prefetch improves throughput but increases memory usage
        prefetch: 50

        # Acknowledgment mode
        acknowledge-mode: manual

        # Retry configuration
        retry:
          enabled: false  # We handle retries manually via DLX

        # Consumer transaction
        transaction-size: 10

        # Idle event interval
        idle-event-interval: 30000

    # Template configuration for publishers
    template:
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        max-interval: 10000
        multiplier: 2.0
      mandatory: true
      receive-timeout: 5000
      reply-timeout: 5000

  # Database Configuration (MSSQL) - Production
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    # HikariCP connection pool for high performance
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: MessageTrackingPool
      auto-commit: false

  # JPA Configuration - Production
  jpa:
    hibernate:
      ddl-auto: validate  # Use validate in production (no auto schema changes)
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: false
        jdbc:
          batch_size: 50
          fetch_size: 100
        order_inserts: true
        order_updates: true
        connection:
          provider_disables_autocommit: true
        query:
          in_clause_parameter_padding: true
        generate_statistics: false

  # Jackson JSON configuration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

# Server configuration
server:
  port: 8080
  tomcat:
    threads:
      max: 200
      min-spare: 10
    accept-count: 100
    max-connections: 8192

# Actuator configuration for health checks and monitoring
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,rabbitmq
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    rabbitmq:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# Logging - Production
logging:
  level:
    root: INFO
    com.example.demo: INFO
    org.springframework.amqp: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/rabbitmq-app/application.log
    max-size: 100MB
    max-history: 30

# Custom Application Properties - Production
app:
  # Async messaging configuration - Production overrides
  # IMPORTANT: Thread count must align with database connections and pod count
  #
  # Scaling Formula:
  #   (core-threads × pod-count) ≤ datasource.hikari.maximum-pool-size
  #
  # Example configurations:
  #   1 pod:  core=15, max=15  → 15 threads  ≤ 50 DB connections ✓
  #   3 pods: core=15, max=15  → 45 threads  ≤ 50 DB connections ✓
  #   5 pods: core=10, max=10  → 50 threads  ≤ 50 DB connections ✓
  #
  # To scale beyond 50 total threads, increase hikari.maximum-pool-size
  messaging:
    async:
      enabled: true
      executor:
        # Conservative defaults for 3-pod deployment
        # Adjust based on actual pod count and DB pool size
        core-threads: 15              # 15 threads × 3 pods = 45 ≤ 50 DB connections
        max-threads: 15               # Keep max = core to prevent DB pool exhaustion
      processing:
        timeout-ms: 60000             # 60 seconds (longer for production)

  rabbitmq:
    # Exchange configuration with federation support
    exchange:
      name: inappcommunication.communication-fed
      type: direct  # Direct exchange for production
      durable: true
      dlx-name: inappcommunication.communication-dlx-fed

    # Queue configuration
    queue:
      ttl: 86400000  # 24 hours in milliseconds
      prefix: inappcommunication.priority
      suffix: -fed

    # Retry configuration
    retry:
      max-attempts: 3
      base-delay: 1000  # 1 second base
      use-jitter: false  # Fixed delays for now
      delays:
        - 2000   # 2 seconds
        - 4000   # 4 seconds
        - 8000   # 8 seconds

    # Monitoring configuration
    monitoring:
      max-queue-depth: 10000  # Alert when queue has more than 10K messages

  # Tracking
  tracking:
    id-prefix: MSG
    id-length: 32
